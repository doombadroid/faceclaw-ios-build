name: Build unsigned OcuSmart iOS IPA

# Builds OcuSmart (doombadroid/faceclaw, a fork of jimrandomh/faceclaw, GPL-3.0)
# or upstream Faceclaw for iPhone on a GitHub macOS runner,
# with code signing switched off. The IPA must be signed with your own Apple ID
# when it is installed (AltStore / SideStore / Sideloadly).
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to build (OcuSmart fork or upstream jimrandomh/faceclaw)
        default: doombadroid/faceclaw
      ref:
        description: Branch, tag or commit
        default: ocusmart-ui
      runner:
        description: Runner image (macos-15 has Xcode up to 26.x; xcode-27 has Xcode 27.x for the iOS 27 SDK)
        default: macos-15
      xcode:
        description: Xcode version for setup-xcode (e.g. latest-stable, 26.3, 27.1)
        default: latest-stable
      configuration:
        description: Debug or Release
        default: Release

permissions:
  contents: write   # publish the IPA as a release and update the SideStore feed

jobs:
  ipa:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: faceclaw
    steps:
      - name: Check out upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          path: faceclaw   # NativeScript names the Xcode project after this folder

      # Upstream uses iOS 26 SDK names (e.g. AVAudioSessionCategoryOptionAllowBluetoothHFP);
      # the runner's default Xcode is older.
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '${{ inputs.xcode }}' }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Toolchain versions
        run: |
          xcodebuild -version
          pod --version
          node --version
          git log -1 --format='upstream %H %ad %s' --date=short

      - name: Install dependencies
        run: |
          npm ci
          npm install -g nativescript
          ns --version

      - name: Prepare the Xcode project (webpack bundle, Kotlin framework, pods)
        run: |
          flag=""; [ "${{ inputs.configuration }}" = "Release" ] && flag="--release"
          scripts/ios.sh prepare ios $flag

      # Pods such as SVGKit still declare iOS 8.0, which Xcode 16 cannot link (libarclite is gone).
      # A command-line build setting overrides every target; 15.1 is the app's own minimum.
      - name: Build without signing
        run: |
          cd platforms/ios
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          echo "workspace=$workspace scheme=$scheme"
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration "${{ inputs.configuration }}" -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Faceclaw.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.1 \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E '^(\*\*|error:|warning: .*deprecated|▸|ld:|Undefined|clang: error)|error:' || true
          test -d "$RUNNER_TEMP/Faceclaw.xcarchive/Products/Applications"

      - name: Package IPA
        run: |
          cd "$RUNNER_TEMP"
          mkdir Payload
          cp -R Faceclaw.xcarchive/Products/Applications/*.app Payload/
          # Upstream's version never changes (1.0.0), so SideStore could not tell builds apart.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.${{ github.run_number }}" -c "Set :CFBundleVersion ${{ github.run_number }}" Payload/*.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :MinimumOSVersion' Payload/*.app/Info.plist
          # Name the release after the app that was built (OcuSmart for the fork, Faceclaw
          # for upstream), so a release never claims to be an app it is not.
          display=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Payload/*.app/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Print :CFBundleName' Payload/*.app/Info.plist)
          app=$(printf '%s' "$display" | tr -cd 'A-Za-z0-9')
          test -n "$app"
          echo "APP_NAME=$app" >> "$GITHUB_ENV"
          echo "APP_DISPLAY_NAME=$display" >> "$GITHUB_ENV"
          # Record which toolchain built it: the iOS 27 SDK changes launch rules (UIScene)
          # and iPhone Duo layout, so a build's SDK must be readable from its release.
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/*.app/Info.plist)
          sdk=$(xcrun vtool -show-build Payload/*.app/"$exe" | awk '/sdk/ {print $2; exit}')
          xcode=$(xcodebuild -version | tr '\n' ' ' | sed 's/ *$//')
          echo "Built with $xcode, iOS SDK $sdk"
          echo "BUILD_TOOLCHAIN=$xcode, iOS SDK $sdk" >> "$GITHUB_ENV"
          zip -qry "$app-unsigned.ipa" Payload
          ls -la "$app-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ env.APP_NAME }}-unsigned.ipa
          if-no-files-found: error

      - name: Publish as a release (downloadable from the phone, no login)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          sha=$(git -C "$GITHUB_WORKSPACE/faceclaw" rev-parse --short HEAD)
          gh release create "build-${{ github.run_number }}" "$APP_NAME-unsigned.ipa" --repo "${{ github.repository }}" \
            --title "$APP_DISPLAY_NAME iOS build ${{ github.run_number }} (${{ inputs.repository }}@${{ inputs.ref }} $sha)" \
            --notes "Unsigned IPA of ${{ inputs.repository }} at $sha (${{ inputs.configuration }}; $BUILD_TOOLCHAIN on ${{ inputs.runner }}). Sign it with your own Apple ID: open it in SideStore, or use Impactor / plumesign from a computer. Source: https://github.com/${{ inputs.repository }}/tree/$sha (GPL-3.0)."

      - name: Check out this recipe repo for the SideStore feed
        uses: actions/checkout@v4
        with: { path: recipe }

      - name: Update the SideStore source feed
        working-directory: recipe
        run: |
          python3 - <<'PY'
          import json, os, datetime
          run = "${{ github.run_number }}"
          repo = "${{ github.repository }}"
          path = "sidestore-source.json"
          DESCRIPTION = ("Developer-beta iOS build of OcuSmart, a fork of jimrandomh/faceclaw (GPL-3.0). "
                         "Talks to the glasses only with custom firmware (Faceclaw's patch set today); "
                         "flashing that voids the warranty and can brick the glasses.")
          app, display = os.environ["APP_NAME"], os.environ["APP_DISPLAY_NAME"]
          size = os.path.getsize(os.path.join(os.environ["RUNNER_TEMP"], f"{app}-unsigned.ipa"))
          try:
              source = json.load(open(path))
          except FileNotFoundError:
              source = {
                  "name": "OcuSmart iOS builds (doombadroid)",
                  "identifier": "io.github.doombadroid.faceclaw-ios-build",
                  "subtitle": "OcuSmart, a fork of jimrandomh/faceclaw, and upstream Faceclaw",
                  "apps": [{
                      "name": display,
                      "bundleIdentifier": "com.faceclaw.app",
                      "developerName": "doombadroid (fork of jimrandomh/faceclaw)",
                      "subtitle": "Alternative companion app for Even Realities G2",
                      "localizedDescription": DESCRIPTION,
                      "iconURL": "https://raw.githubusercontent.com/doombadroid/faceclaw/ocusmart-ui/App_Resources/iOS/Assets.xcassets/AppIcon.appiconset/AppIcon.png",
                      "tintColor": "3cf27c",
                      "versions": [],
                      "appPermissions": {"entitlements": [], "privacy": {}},
                  }],
                  "news": [],
              }
          # The listed name follows the newest build; the source and bundle identifiers never
          # change, or SideStore would treat it as a different source or a different app.
          source["apps"][0]["name"] = display
          versions = source["apps"][0]["versions"]
          versions.insert(0, {
              "version": f"1.0.{run}",
              "buildVersion": run,
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "localizedDescription": "${{ inputs.repository }}@${{ inputs.ref }} (${{ inputs.configuration }})",
              "downloadURL": f"https://github.com/{repo}/releases/download/build-{run}/{app}-unsigned.ipa",
              "size": size,
              "minOSVersion": "15.1",
          })
          del versions[5:]
          json.dump(source, open(path, "w"), indent=2)
          open(path, "a").write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore-source.json
          git commit -qm "SideStore feed: build ${{ github.run_number }}"
          git push -q

      - name: Keep the full build log when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
